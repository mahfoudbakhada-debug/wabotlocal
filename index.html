<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Peluquería Demo</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;text-align:center;padding:20px}
.card{background:white;max-width:360px;margin:0 auto;border-radius:20px;padding:15px;box-shadow:0 10px 30px rgba(0,0,0,0.1)}
.chat{background:#e5ddd5;border-radius:10px;padding:10px;text-align:left}
.msg{background:white;padding:10px;border-radius:10px;margin:10px 0}
</style>
</head>
<body>

<h1 id="titulo-negocio">Peluquería</h1>
<p>Tu peluquería reserva sola por WhatsApp</p>

<div class="card">
  <div class="chat">
    <strong id="chat-nombre">Peluquería</strong>
    <div class="msg">
      Hola! Soy el asistente virtual de <span class="nombre-dinamico">tu peluquería</span> 👋<br><br>
      1️⃣ Ver servicios/precios<br>
      2️⃣ Reservar cita<br>
      3️⃣ Hablar con una persona
    </div>
  </div>
</div>

<script>
// ESTO ES LO QUE HACE LA MAGIA
fetch('./config.json')
  .then(res => res.json())
  .then(config => {
    const nombre = config.nombre_negocio;
    document.getElementById('titulo-negocio').textContent = nombre;
    document.getElementById('chat-nombre').textContent = nombre;
    document.getElementById('page-title').textContent = nombre + " - Reserva por WhatsApp";
    document.querySelectorAll('.nombre-dinamico').forEach(el => el.textContent = nombre);
  });
</script>

</body>
</html>
